<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<link rel="icon" href="data:,">
<title>WorkTime Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/chart.umd.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="banner" class="banner" role="alert" hidden></div>
<main id="main">
  <header class="header">
    <h1>WorkTime</h1>
    <div class="header-right">
      <span id="status-pill" class="status-pill"></span>
      <span id="generated" class="generated"></span>
    </div>
  </header>

  <section id="cards" class="cards"></section>

  <section id="range-card" class="card range-card">
    <div class="range-row">
      <span class="card-label">RANGE</span>
      <div id="range-presets" class="range-presets"></div>
      <div class="range-dates">
        <input type="date" id="range-start" aria-label="Range start date">
        <span class="range-dash">&ndash;</span>
        <input type="date" id="range-end" aria-label="Range end date">
      </div>
    </div>
    <div id="range-error" class="range-error" hidden></div>
    <div id="range-summary" class="range-summary"></div>
  </section>

  <section class="card chart-card">
    <div class="chart-header">
      <span class="chart-title">Hours per day</span>
      <span id="chart-subtitle" class="chart-subtitle"></span>
    </div>
    <div class="chart-box">
      <canvas id="daily-chart" aria-label="Hours worked per day" role="img"></canvas>
    </div>
  </section>

  <!-- Task 6: trend chart and recent sessions go here -->
</main>
</body>
</html>
