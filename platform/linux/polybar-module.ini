; WorkTime Logger — polybar module.
; platform/linux/install.sh prints this with the real path filled in.
; Shows the running session time (e.g. "1h 24m"); hidden when nothing runs.
[module/worktime]
type = custom/script
exec = @WORKTIME@ status --short
interval = 15
format-prefix = "󰔛 "
format-prefix-foreground = ${colors.green}
label = %output%
click-left = @WORKTIME@ dashboard
