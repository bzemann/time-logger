# WorkTime Logger — i3 keybindings.
# platform/linux/install.sh prints these lines with the real path filled in.
# Paste them into ~/.config/i3/config (or ~/.i3/config), then reload i3 ($mod+Shift+c).

# Start a session / show the running time
bindsym $mod+Shift+t exec --no-startup-id @WORKTIME@ start
# Stop the running session
bindsym $mod+Shift+x exec --no-startup-id @WORKTIME@ stop
# Open the dashboard
bindsym $mod+Shift+d exec --no-startup-id @WORKTIME@ dashboard
# Weekly report (this week so far). Not $mod+Shift+r: that restarts i3 in the default config.
bindsym $mod+Shift+w exec --no-startup-id @WORKTIME@ report week
